name: Build preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: ./scripts/build.sh

      - name: Verify app version
        id: version
        run: |
          VERSION="$(sed -nE 's/^### \[([0-9]{4}\.[0-9]{2}\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -1)"
          APP="release/macos/PKarchives-${VERSION}.app"
          test -d "$APP"
          INFO_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "$INFO_VERSION" = "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PKarchives-preview
          path: release/macos/PKarchives-${{ steps.version.outputs.value }}.app
          if-no-files-found: error
          retention-days: 3
